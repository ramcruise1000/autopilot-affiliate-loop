# weekly ingestion + site build + distribution run
name: loop

on:
  schedule:
    # every Sunday at 06:00 UTC; free on public repos (~1–3 min per run)
    - cron: "0 6 * * 0"
  workflow_dispatch:            # run by hand anytime to refresh

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest sources
        run: python ingest.py

      - name: Generate site
        run: python generator.py

      - name: Publish to GitHub Pages
        run: |
          git config --global user.email "loop@example.com"
          git config --global user.name "loop bot"
          git checkout -b gh-pages || git checkout gh-pages
          git add src/site
          git commit -m "chore: rebuild static site" --allow-empty || true
          git push -f origin gh-pages

      - name: Build social post batches
        if: always()
        run: python publisher.py 
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          BLOGGER_SECRET_EMAIL_ADDRESS: ${{ secrets.BLOGGER_SECRET_EMAIL_ADDRESS }}
