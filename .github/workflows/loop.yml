name: loop

on:
  schedule:
    - cron: "0 6 * * 0"  # Every Sunday at 06:00 UTC
  workflow_dispatch:     # Allows you to run it manually anytime

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest sources
        run: python ingest.py

      - name: Generate site
        run: python generator.py

      - name: Publish to GitHub Pages
        run: |
          echo "=== Verifying site files exist ==="
          ls -la ./site/
          if [ ! -f ./site/index.html ]; then
            echo "ERROR: site/index.html not found!"
            exit 1
          fi
          echo "=== Switching to gh-pages branch ==="
          git config --global user.email "loop@example.com"
          git config --global user.name "loop bot"
          git checkout -b gh-pages || git checkout gh-pages
          
          echo "=== Moving generated files to root ==="
          # Copy everything from the site folder to the root of the branch
          cp -r ./site/* .
          # Remove the now-empty site folder to keep things clean
          rm -rf ./site
          
          echo "=== Committing and pushing ==="
          git add .
          git commit -m "chore: rebuild static site"
          git push -f origin gh-pages
          echo "=== Successfully published to gh-pages root ==="

      - name: Build social post batches
        if: always()
        run: python publisher.py
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
