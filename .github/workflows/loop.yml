      - name: Publish to GitHub Pages
        run: |
          echo "=== Verifying site files exist ==="
          ls -la ./site/
          if [ ! -f ./site/index.html ]; then
            echo "ERROR: site/index.html not found!"
            exit 1
          fi
          echo "=== Switching to gh-pages branch ==="
          git config --global user.email "loop@example.com"
          git config --global user.name "loop bot"
          git checkout -b gh-pages || git checkout gh-pages
          
          echo "=== Moving generated files to root ==="
          # Copy everything from the site folder to the root of the branch
          cp -r ./site/* .
          # Remove the now-empty site folder to keep things clean
          rm -rf ./site
          
          echo "=== Committing and pushing ==="
          git add .
          git commit -m "chore: rebuild static site"
          git push -f origin gh-pages
          echo "=== Successfully published to gh-pages root ==="
